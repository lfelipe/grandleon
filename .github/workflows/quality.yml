# SPDX-License-Identifier: MIT
name: Quality

# Manual dispatch only. `scripts/local-ci.sh` is the gate, because the hosted
# runners' compiler versions differ from the ones this project pins and the
# difference shows up as failures that say nothing about the change.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - c++
          - clang++
    runs-on: ubuntu-latest
    env:
      CXX: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/source_schema/package-lock.json
      - name: Install source-schema test dependencies
        run: npm ci --prefix tools/source_schema
      - name: Configure
        run: cmake -S . -B build -DGRANDLEON_BUILD_TESTS=ON -DGRANDLEON_WERROR=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
