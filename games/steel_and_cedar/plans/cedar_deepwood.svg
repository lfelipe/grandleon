<text x="710" y="122" text-anchor="start" font-size="20" fill="#f2ead5">A forest, not a park</text>
<text x="710" y="159" text-anchor="start" font-size="15" fill="#cbd0c7">Two irregular clearings.</text>
<text x="710" y="186" text-anchor="start" font-size="15" fill="#cbd0c7">Road follows the brook.</text>
<text x="710" y="213" text-anchor="start" font-size="15" fill="#cbd0c7">Old trees mark the bends.</text>
<text x="710" y="240" text-anchor="start" font-size="15" fill="#cbd0c7">Logs and roots belong</text>
<text x="710" y="267" text-anchor="start" font-size="15" fill="#cbd0c7">on woodland edges.</text>
<text x="710" y="294" text-anchor="start" font-size="15" fill="#cbd0c7">No isolated stone tower.</text>
<text x="710" y="321" text-anchor="start" font-size="15" fill="#cbd0c7">Co-op trails meet at exit.</text>
